# Builds an installable debug APK of the Ovoz Lab Android shell.
#
# The shell loads the live site (capacitor.config.ts), so the APK picks up
# every web change without a rebuild. Run it from GitHub → Actions →
# "Android APK" → Run workflow; give the site address if it is not
# https://ovoz-lab.vercel.app, then download the `ovoz-lab-debug-apk` artifact.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site address the app opens
        required: false
        default: https://ovoz-lab.vercel.app

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      OVOZ_LAB_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 builds with Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Generate the native project
        run: |
          npx cap add android
          # Recording a voice sample: the WebView can open the microphone only
          # if the app itself holds the permission.
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' \
            android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ovoz-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
